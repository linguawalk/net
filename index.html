<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaWalk</title>
<meta name="description" content="AI 기반 언어 학습 플랫폼">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif;
    background:linear-gradient(135deg,#0b1729 0%,#1C2B45 55%,#0d2235 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  /* 로고 */
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:14px;text-decoration:none;}
  .logo-icon{
    width:56px;height:56px;background:#2A7F6F;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#fff;letter-spacing:-1px;
  }
  .logo-text{font-family:'DM Serif Display',serif;font-size:38px;color:#fff;}

  .tagline{
    font-size:15px;color:rgba(255,255,255,0.55);
    text-align:center;line-height:1.65;margin-bottom:56px;
  }

  /* 언어 선택 카드 */
  .lang-grid{
    display:flex;gap:20px;flex-wrap:wrap;justify-content:center;
    margin-bottom:48px;
  }
  .lang-card{
    width:200px;padding:32px 20px 24px;
    background:rgba(255,255,255,0.07);
    border:1.5px solid rgba(255,255,255,0.13);
    border-radius:20px;text-decoration:none;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:all 0.25s;backdrop-filter:blur(10px);
  }
  .lang-card:hover{
    background:rgba(255,255,255,0.13);
    border-color:#2A7F6F;
    transform:translateY(-5px);
    box-shadow:0 16px 40px rgba(42,127,111,0.22);
  }
  .lang-flag{font-size:48px;line-height:1;}
  .lang-name{
    font-family:'DM Serif Display',serif;
    font-size:22px;margin-top:4px;
  }
  .lang-sub{
    font-size:12px;color:rgba(255,255,255,0.45);
    text-align:center;line-height:1.5;
  }
  .lang-btn{
    margin-top:8px;padding:8px 22px;border-radius:20px;
    background:#2A7F6F;color:#fff;
    font-size:12px;font-weight:600;
    font-family:'DM Sans',sans-serif;
    transition:background 0.2s;
  }
  .lang-card:hover .lang-btn{background:#1D9E75;}

  /* 준비 중 배지 */
  .coming-soon{
    font-size:10px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;padding:3px 10px;
    border-radius:10px;background:rgba(255,255,255,0.1);
    color:rgba(255,255,255,0.4);margin-top:4px;
  }

  .footer{font-size:12px;color:rgba(255,255,255,0.2);text-align:center;}

  @media(max-width:480px){
    .lang-grid{flex-direction:column;align-items:center;}
    .lang-card{width:100%;max-width:280px;}
  }
</style>
</head>
<body>

<a href="en/index.html" class="logo">
  <div class="logo-icon">LW</div>
  <span class="logo-text">LinguaWalk</span>
</a>

<p class="tagline">AI 기반 언어 학습 플랫폼<br>AI-powered Language Learning Platform</p>

<div class="lang-grid">

  <!-- 영어 -->
  <a href="en/index.html" class="lang-card">
    <span class="lang-flag">🇺🇸</span>
    <span class="lang-name">English</span>
    <span class="lang-sub">General · TOEIC · TOEFL<br>IELTS · OPIc</span>
    <span class="lang-btn">학습 시작 →</span>
  </a>

  <!-- 추후 확장용 (표시 제거하려면 이 블록 삭제) -->
  <!--
  <div class="lang-card" style="cursor:default;opacity:0.5;">
    <span class="lang-flag">🇯🇵</span>
    <span class="lang-name">日本語</span>
    <span class="lang-sub">준비 중</span>
    <span class="coming-soon">Coming Soon</span>
  </div>
  -->

</div>

<p class="footer">© 2025 LinguaWalk · Powered by Claude AI</p>

</body>
</html>
