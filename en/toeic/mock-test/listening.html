<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC 모의고사 – Listening Part 1 | LinguaWalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:   #1C2B45;
      --teal:   #2A7F6F;
      --toeic:  #ba7517;
      --white:  #ffffff;
      --bg:     #f0f3f8;
      --card:   #ffffff;
      --border: #dde3ee;
      --text:   #1a202c;
      --muted:  #64748b;
      --danger: #e53e3e;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(28,43,69,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 헤더 ───────────────────────────────────── */
    header {
      background: var(--navy);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 1.25rem;
      text-decoration: none;
    }
    .logo span { color: var(--teal); }

    /* 시험 정보 바 */
    .exam-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: .82rem;
      color: rgba(255,255,255,.7);
    }
    .exam-badge {
      background: var(--toeic);
      color: var(--white);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .72rem;
      letter-spacing: .06em;
    }
    .timer {
      font-size: .95rem;
      font-weight: 700;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }
    .timer.warn { color: #fc8181; }

    /* ── 진행 바 ────────────────────────────────── */
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,.15);
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--toeic);
      transition: width .4s ease;
    }

    /* ── 메인 레이아웃 ──────────────────────────── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ── 시작 화면 ──────────────────────────────── */
    #startScreen {
      text-align: center;
      padding: 60px 20px;
    }
    .start-icon {
      width: 72px;
      height: 72px;
      background: var(--toeic);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .start-icon svg { width: 36px; height: 36px; color: var(--white); }
    .start-title {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--navy);
      margin-bottom: 10px;
    }
    .start-desc {
      color: var(--muted);
      font-size: .95rem;
      max-width: 480px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
    .start-info {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .info-item { text-align: center; }
    .info-num {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--toeic);
    }
    .info-label { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    /* ── 문제 화면 ──────────────────────────────── */
    #examScreen { display: none; }

    .q-counter {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .q-counter strong { color: var(--navy); }

    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* 이미지 */
    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #dde3ee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 로딩 오버레이 */
    .img-overlay {
      position: absolute;
      inset: 0;
      background: rgba(28,43,69,.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--white);
      font-size: .85rem;
      transition: opacity .3s;
    }
    .img-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 에러 */
    .img-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: .82rem;
    }
    .img-error svg { width: 40px; height: 40px; opacity: .35; }

    /* Q 번호 배지 */
    .q-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--toeic);
      color: var(--white);
      font-weight: 700;
      font-size: .75rem;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* 선택지 */
    .card-body { padding: 20px 24px 24px; }
    .choices { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-size: .9rem;
    }
    .choice:hover:not(.locked) { border-color: var(--toeic); background: #fffbf5; }
    .choice.selected  { border-color: var(--toeic); background: #fff8f0; }
    .choice.correct   { border-color: var(--teal);  background: #f0faf8; }
    .choice.wrong     { border-color: var(--danger); background: #fff5f5; }
    .choice.locked    { cursor: default; }
    .choice-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .8rem;
      flex-shrink: 0;
    }

    /* 내비게이션 */
    .nav-row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .btn {
      padding: 11px 28px;
      border-radius: 9px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--toeic); color: var(--white); }
    .btn-navy    { background: var(--navy);  color: var(--white); }
    .btn-outline { background: transparent; border: 2px solid var(--navy); color: var(--navy); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── 결과 화면 ──────────────────────────────── */
    #resultScreen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .result-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 6px solid var(--toeic);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .result-score { font-size: 2.4rem; font-weight: 700; color: var(--toeic); line-height: 1; }
    .result-total { font-size: .82rem; color: var(--muted); }
    .result-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .result-msg { color: var(--muted); margin-bottom: 32px; font-size: .9rem; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      max-width: 480px;
      margin: 0 auto 36px;
    }
    .result-stat {
      background: var(--card);
      border-radius: 10px;
      padding: 16px 12px;
      box-shadow: var(--shadow);
    }
    .result-stat-num { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
    .result-stat-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }

    /* 상태 바 */
    .status-bar {
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <a href="/index.html" class="logo">Lingua<span>Walk</span></a>
  <div class="exam-bar">
    <span class="exam-badge">TOEIC MOCK TEST</span>
    <span>Listening · Part 1</span>
    <span class="timer" id="timerDisplay">20:00</span>
  </div>
</header>

<div class="progress-track">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<main>

  <!-- ── 시작 화면 ── -->
  <section id="startScreen">
    <div class="start-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </div>
    <h1 class="start-title">TOEIC Listening<br>Part 1 모의고사</h1>
    <p class="start-desc">
      AI가 실제 시험 수준의 사진을 생성합니다.<br>
      각 사진을 보고 올바른 묘사를 고르세요.
    </p>
    <div class="start-info">
      <div class="info-item"><div class="info-num">6</div><div class="info-label">문항</div></div>
      <div class="info-item"><div class="info-num">20</div><div class="info-label">분</div></div>
      <div class="info-item"><div class="info-num">4</div><div class="info-label">선택지</div></div>
    </div>
    <button class="btn btn-primary" onclick="startExam()">시험 시작</button>
  </section>

  <!-- ── 시험 화면 ── -->
  <section id="examScreen">
    <div class="q-counter">
      <span>문제 <strong id="qNum">1</strong> / <strong id="qTotal">6</strong></span>
      <span id="qStatus"></span>
    </div>

    <div class="question-card" id="questionCard">
      <div class="img-wrapper" id="imgWrapper">
        <img id="questionImg" src="" alt="" />
        <span class="q-badge" id="qBadge">Q1</span>
        <div class="img-overlay" id="imgOverlay">
          <div class="spinner"></div>
          <span id="genStatus">AI 이미지 생성 중…</span>
        </div>
        <div class="img-error" id="imgError">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 9l6 6M15 9l-6 6"/>
          </svg>
          <span>이미지 생성 실패</span>
        </div>
      </div>

      <div class="card-body">
        <ul class="choices" id="choicesList"></ul>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="nav-row">
      <button class="btn btn-outline" id="prevBtn" onclick="navigate(-1)" disabled>← 이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="navigate(1)">다음 →</button>
    </div>
  </section>

  <!-- ── 결과 화면 ── -->
  <section id="resultScreen">
    <div class="result-circle">
      <div class="result-score" id="resultScore">0</div>
      <div class="result-total" id="resultTotal">/ 6</div>
    </div>
    <h2 class="result-title" id="resultTitle">결과</h2>
    <p class="result-msg" id="resultMsg"></p>
    <div class="result-grid">
      <div class="result-stat">
        <div class="result-stat-num" id="statCorrect">0</div>
        <div class="result-stat-label">정답</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num" id="statWrong">0</div>
        <div class="result-stat-label">오답</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num" id="statSkipped">0</div>
        <div class="result-stat-label">미응답</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num" id="statTime">—</div>
        <div class="result-stat-label">소요 시간</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="restartExam()">다시 풀기</button>
      <button class="btn btn-navy"    onclick="location.href='/toeic/listening.html'">학습 모드</button>
    </div>
  </section>

</main>

<script>
// ── 문제 세트 ────────────────────────────────────────────────────────────────
const ALL_QUESTIONS = [
  {
    imagePrompt: 'man sitting at office desk working on laptop, modern office, natural daylight',
    choices: ['The man is typing on a keyboard.', 'The man is talking on the phone.', 'The man is reading a newspaper.', 'The man is standing near a window.'],
    answer: 0,
  },
  {
    imagePrompt: 'woman arranging colorful flowers in a glass vase on a wooden table, bright kitchen, daylight',
    choices: ['A woman is watering some plants.', 'A woman is arranging flowers in a vase.', 'A woman is setting the table for dinner.', 'A woman is cleaning the kitchen counter.'],
    answer: 1,
  },
  {
    imagePrompt: 'people standing at urban bus stop on a city street, daytime, buildings in background, realistic photo',
    choices: ['Some people are getting off a bus.', 'A crowd is crossing the street.', 'People are waiting at a bus stop.', 'Passengers are boarding a train.'],
    answer: 2,
  },
  {
    imagePrompt: 'professional chef cooking on a stainless steel stove in a busy restaurant kitchen, steam rising',
    choices: ['The chef is washing dishes.', 'The chef is serving food to customers.', 'The chef is cutting vegetables on a board.', 'The chef is cooking on a stove.'],
    answer: 3,
  },
  {
    imagePrompt: 'rows of books neatly stacked on wooden shelves in a quiet library, warm lighting',
    choices: ['Books are stacked on shelves.', 'A librarian is checking out books.', 'Students are reading at desks.', 'Magazines are displayed on a rack.'],
    answer: 0,
  },
  {
    imagePrompt: 'workers in hard hats at an outdoor construction site, clear sky, machinery in background',
    choices: ['Workers are repairing a road.', 'Workers are eating lunch outdoors.', 'Workers are wearing safety helmets at a construction site.', 'Workers are unloading boxes from a truck.'],
    answer: 2,
  },
];

const TOTAL_TIME = 20 * 60; // 20분 (초)
const LETTERS = ['A', 'B', 'C', 'D'];

// ── 상태 ────────────────────────────────────────────────────────────────────
let questions = [];
let currentIdx = 0;
let userAnswers = [];
let timerInterval = null;
let secondsLeft = TOTAL_TIME;
let startTimestamp = null;
let imageCache = {};

// ── 시험 시작 ────────────────────────────────────────────────────────────────
function startExam() {
  // 문제 섞기
  questions = [...ALL_QUESTIONS].sort(() => Math.random() - .5).slice(0, 6);
  userAnswers = new Array(questions.length).fill(null);
  currentIdx = 0;
  secondsLeft = TOTAL_TIME;
  startTimestamp = Date.now();

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  document.getElementById('qTotal').textContent = questions.length;

  startTimer();
  renderQuestion();

  // 첫 3문제 미리 생성
  questions.slice(0, 3).forEach(q => prefetchImage(q));
}

// ── 타이머 ───────────────────────────────────────────────────────────────────
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      finishExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
  const s = String(secondsLeft % 60).padStart(2, '0');
  const el = document.getElementById('timerDisplay');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('warn', secondsLeft <= 60);
}

// ── 문제 렌더링 ───────────────────────────────────────────────────────────────
function renderQuestion() {
  const q = questions[currentIdx];
  const n = currentIdx + 1;

  document.getElementById('qNum').textContent = n;
  document.getElementById('qBadge').textContent = `Q${n}`;
  document.getElementById('progressFill').style.width =
    `${((currentIdx) / questions.length) * 100}%`;

  // 버튼
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').textContent =
    currentIdx === questions.length - 1 ? '제출 →' : '다음 →';

  // 선택지
  const list = document.getElementById('choicesList');
  list.innerHTML = '';
  const saved = userAnswers[currentIdx];
  q.choices.forEach((text, i) => {
    const li = document.createElement('li');
    li.className = 'choice' + (saved === i ? ' selected' : '');
    li.innerHTML = `<span class="choice-letter">${LETTERS[i]}</span><span>${text}</span>`;
    li.addEventListener('click', () => selectChoice(i));
    list.appendChild(li);
  });

  updateQStatus();

  // 이미지
  generateImage(q);

  // 다음 문제 미리 로드
  if (currentIdx + 1 < questions.length) prefetchImage(questions[currentIdx + 1]);
}

function updateQStatus() {
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById('qStatus').textContent = `답변 ${answered}/${questions.length}`;
}

// ── 선택지 선택 ──────────────────────────────────────────────────────────────
function selectChoice(idx) {
  userAnswers[currentIdx] = idx;
  const all = document.getElementById('choicesList').querySelectorAll('.choice');
  all.forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  updateQStatus();
}

// ── 내비게이션 ───────────────────────────────────────────────────────────────
function navigate(dir) {
  const next = currentIdx + dir;
  if (next < 0) return;
  if (next >= questions.length) {
    finishExam();
    return;
  }
  currentIdx = next;
  renderQuestion();
}

// ── 시험 종료 ────────────────────────────────────────────────────────────────
function finishExam() {
  clearInterval(timerInterval);

  const correct  = questions.filter((q, i) => userAnswers[i] === q.answer).length;
  const wrong    = questions.filter((q, i) => userAnswers[i] !== null && userAnswers[i] !== q.answer).length;
  const skipped  = questions.filter((q, i) => userAnswers[i] === null).length;
  const elapsed  = Math.round((Date.now() - startTimestamp) / 1000);
  const em = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const es = String(elapsed % 60).padStart(2, '0');

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  document.getElementById('resultScore').textContent = correct;
  document.getElementById('resultTotal').textContent = `/ ${questions.length}`;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent   = wrong;
  document.getElementById('statSkipped').textContent = skipped;
  document.getElementById('statTime').textContent    = `${em}:${es}`;

  const pct = Math.round((correct / questions.length) * 100);
  document.getElementById('resultTitle').textContent =
    pct >= 80 ? '훌륭해요! 🎉' : pct >= 50 ? '잘 했어요! 👍' : '더 연습해봐요 💪';
  document.getElementById('resultMsg').textContent =
    `정답률 ${pct}% · ${questions.length}문제 중 ${correct}문제 정답`;

  document.getElementById('progressFill').style.width = '100%';
}

function restartExam() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('startScreen').style.display  = 'block';
}

// ── Stability AI 이미지 생성 ─────────────────────────────────────────────────
async function generateImage(q) {
  const key = q.imagePrompt;

  if (imageCache[key]) {
    showImage(imageCache[key]);
    return;
  }

  // 로딩 상태
  document.getElementById('questionImg').src = '';
  document.getElementById('imgError').style.display = 'none';
  document.getElementById('imgOverlay').classList.remove('hidden');
  document.getElementById('genStatus').textContent = 'AI 이미지 생성 중…';
  document.getElementById('statusBar').textContent = '';

  try {
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: q.imagePrompt,
        style: 'photographic',
        aspectRatio: '16:9',
      }),
    });

    const data = await res.json();
    if (!res.ok || !data.imageUrl) throw new Error(data.error || 'failed');

    imageCache[key] = data.imageUrl;
    showImage(data.imageUrl);

  } catch (err) {
    document.getElementById('imgOverlay').classList.add('hidden');
    const errEl = document.getElementById('imgError');
    errEl.style.display = 'flex';
    document.getElementById('statusBar').textContent =
      '⚠️ 이미지 생성 실패 — 다음 문제로 진행할 수 있습니다.';
  }
}

function showImage(dataUrl) {
  const img = document.getElementById('questionImg');
  img.onload = () => {
    document.getElementById('imgOverlay').classList.add('hidden');
    document.getElementById('imgError').style.display = 'none';
  };
  img.src = dataUrl;
}

async function prefetchImage(q) {
  if (imageCache[q.imagePrompt]) return;
  try {
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: q.imagePrompt, style: 'photographic', aspectRatio: '16:9' }),
    });
    const data = await res.json();
    if (data.imageUrl) imageCache[q.imagePrompt] = data.imageUrl;
  } catch (_) { /* silent prefetch failure */ }
}
</script>
