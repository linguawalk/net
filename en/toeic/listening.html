<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC Listening – Part 1 | LinguaWalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <style>
    /* ── 디자인 토큰 ────────────────────────────── */
    :root {
      --navy:   #1C2B45;
      --teal:   #2A7F6F;
      --toeic:  #ba7517;
      --white:  #ffffff;
      --bg:     #f5f7fa;
      --card:   #ffffff;
      --border: #e2e8f0;
      --text:   #1a202c;
      --muted:  #64748b;
      --radius: 12px;
      --shadow: 0 2px 16px rgba(28,43,69,.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 헤더 ───────────────────────────────────── */
    header {
      background: var(--navy);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      color: var(--white);
      font-size: 1.3rem;
      text-decoration: none;
    }
    .logo span { color: var(--teal); }
    .badge {
      background: var(--toeic);
      color: var(--white);
      font-size: .75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: .04em;
    }

    /* ── 메인 ───────────────────────────────────── */
    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .page-sub {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 28px;
    }

    /* ── 카드 ───────────────────────────────────── */
    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 28px;
    }

    /* 이미지 영역 */
    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #e8edf5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .3s;
    }
    /* 로딩 오버레이 */
    .img-overlay {
      position: absolute;
      inset: 0;
      background: rgba(28,43,69,.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--white);
      font-size: .85rem;
      transition: opacity .3s;
    }
    .img-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 재생성 버튼 */
    .regen-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(28,43,69,.75);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: .78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      transition: background .2s;
    }
    .regen-btn:hover { background: var(--teal); }
    .regen-btn svg { width: 14px; height: 14px; }

    /* 문제 본문 */
    .card-body { padding: 20px 24px 24px; }

    .q-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--toeic);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* 선택지 */
    .choices { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      font-size: .9rem;
    }
    .choice:hover { border-color: var(--toeic); background: #fff8f0; }
    .choice.correct { border-color: var(--teal); background: #f0faf8; }
    .choice.wrong   { border-color: #e53e3e;     background: #fff5f5; }
    .choice-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .82rem;
      flex-shrink: 0;
    }

    /* 설명 박스 */
    .explanation {
      margin-top: 16px;
      padding: 14px 16px;
      background: #f0faf8;
      border-left: 4px solid var(--teal);
      border-radius: 0 8px 8px 0;
      font-size: .88rem;
      color: var(--navy);
      display: none;
    }
    .explanation.show { display: block; }

    /* ── 컨트롤 ─────────────────────────────────── */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--toeic); color: var(--white); }
    .btn-outline  { background: transparent; border: 2px solid var(--navy); color: var(--navy); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── 상태 메시지 ─────────────────────────────── */
    .status-bar {
      text-align: center;
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 16px;
      min-height: 20px;
    }

    /* 에러 뱃지 */
    .img-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: .85rem;
    }
    .img-error svg { width: 40px; height: 40px; opacity: .4; }
  </style>
</head>
<body>

<header>
  <a href="/index.html" class="logo">Lingua<span>Walk</span></a>
  <span class="badge">TOEIC</span>
</header>

<main>
  <h1 class="page-title">TOEIC Listening – Part 1</h1>
  <p class="page-sub">사진 묘사 (Photographs) · AI가 실제 시험 이미지를 생성합니다</p>

  <div class="controls">
    <button class="btn btn-primary" id="newQuestionBtn">새 문제 생성</button>
    <button class="btn btn-outline"  id="showAnswerBtn" disabled>정답 확인</button>
  </div>

  <div class="status-bar" id="statusBar">버튼을 눌러 문제를 시작하세요.</div>

  <div class="question-card" id="questionCard" style="display:none">

    <!-- 이미지 영역 -->
    <div class="img-wrapper" id="imgWrapper">
      <img id="questionImg" src="" alt="TOEIC Part 1 사진" />

      <!-- 로딩 오버레이 -->
      <div class="img-overlay" id="imgOverlay">
        <div class="spinner"></div>
        <span>AI 이미지 생성 중…</span>
      </div>

      <!-- 에러 표시 -->
      <div class="img-error" id="imgError" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 9l6 6M15 9l-6 6"/>
        </svg>
        <span>이미지 생성 실패 — 재시도 버튼을 눌러주세요</span>
      </div>

      <!-- 재생성 버튼 -->
      <button class="regen-btn" id="regenBtn" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"/>
        </svg>
        이미지 재생성
      </button>
    </div>

    <!-- 선택지 -->
    <div class="card-body">
      <div class="q-label">Question · Part 1</div>
      <ul class="choices" id="choicesList"></ul>
      <div class="explanation" id="explanation"></div>
    </div>
  </div>
</main>

<script>
// ── 문제 데이터 ─────────────────────────────────────────────────────────────
// 실제 서비스에서는 Firestore에서 가져옵니다.
const QUESTIONS = [
  {
    prompt: 'A man is sitting at a desk using a laptop computer in an office',
    imagePrompt: 'man sitting at office desk working on laptop, modern office, natural light, professional setting',
    choices: [
      'The man is typing on a keyboard.',
      'The man is talking on the phone.',
      'The man is reading a newspaper.',
      'The man is standing near a window.',
    ],
    answer: 0,
    explanation: '(A) 남자가 키보드를 타이핑하고 있다는 묘사가 laptop을 사용하는 장면과 일치합니다.',
  },
  {
    prompt: 'A woman is arranging flowers in a vase on a table',
    imagePrompt: 'woman arranging colorful flowers in a glass vase on a wooden table, bright kitchen, daylight',
    choices: [
      'A woman is watering some plants.',
      'A woman is arranging flowers in a vase.',
      'A woman is setting the table for dinner.',
      'A woman is cleaning the kitchen counter.',
    ],
    answer: 1,
    explanation: '(B) 여자가 꽃병에 꽃을 꽂는 장면을 정확히 묘사합니다.',
  },
  {
    prompt: 'People are waiting at a bus stop on a city street',
    imagePrompt: 'people standing at urban bus stop on a city street, daytime, buildings in background, realistic photo',
    choices: [
      'Some people are getting off a bus.',
      'A crowd is crossing the street.',
      'People are waiting at a bus stop.',
      'Passengers are boarding a train.',
    ],
    answer: 2,
    explanation: '(C) 버스 정류장에서 기다리고 있는 사람들을 올바르게 묘사합니다.',
  },
  {
    prompt: 'A chef is cooking in a restaurant kitchen',
    imagePrompt: 'professional chef cooking on a stainless steel stove in a busy restaurant kitchen, chef uniform, steam rising',
    choices: [
      'The chef is washing dishes.',
      'The chef is serving food to customers.',
      'The chef is cutting vegetables on a board.',
      'The chef is cooking on a stove.',
    ],
    answer: 3,
    explanation: '(D) 셰프가 화로에서 요리하는 모습을 정확히 묘사합니다.',
  },
  {
    prompt: 'Books are stacked on shelves in a library',
    imagePrompt: 'rows of books neatly stacked on wooden shelves in a quiet library, warm lighting, academic setting',
    choices: [
      'Books are stacked on shelves.',
      'A librarian is checking out books.',
      'Students are reading at desks.',
      'Magazines are displayed on a rack.',
    ],
    answer: 0,
    explanation: '(A) 책들이 선반에 쌓여 있는 장면을 가장 정확하게 묘사합니다.',
  },
];

// ── 상태 ────────────────────────────────────────────────────────────────────
let currentQ = null;
let answered = false;
let imageCache = {}; // prompt → dataURL

// ── DOM 요소 ────────────────────────────────────────────────────────────────
const newQuestionBtn = document.getElementById('newQuestionBtn');
const showAnswerBtn  = document.getElementById('showAnswerBtn');
const statusBar      = document.getElementById('statusBar');
const questionCard   = document.getElementById('questionCard');
const imgWrapper     = document.getElementById('imgWrapper');
const questionImg    = document.getElementById('questionImg');
const imgOverlay     = document.getElementById('imgOverlay');
const imgError       = document.getElementById('imgError');
const regenBtn       = document.getElementById('regenBtn');
const choicesList    = document.getElementById('choicesList');
const explanation    = document.getElementById('explanation');

// ── 이벤트 ──────────────────────────────────────────────────────────────────
newQuestionBtn.addEventListener('click', loadNewQuestion);
showAnswerBtn.addEventListener('click', revealAnswer);
regenBtn.addEventListener('click', () => generateImage(currentQ, true));

// ── 문제 로드 ────────────────────────────────────────────────────────────────
function loadNewQuestion() {
  // 랜덤 선택 (이전 문제 제외)
  let pool = QUESTIONS.filter(q => q !== currentQ);
  currentQ = pool[Math.floor(Math.random() * pool.length)];
  answered = false;

  questionCard.style.display = 'block';
  showAnswerBtn.disabled = false;
  explanation.classList.remove('show');
  explanation.textContent = '';
  setStatus('');

  renderChoices();
  generateImage(currentQ, false);
}

// ── 선택지 렌더링 ────────────────────────────────────────────────────────────
function renderChoices() {
  choicesList.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  currentQ.choices.forEach((text, i) => {
    const li = document.createElement('li');
    li.className = 'choice';
    li.innerHTML = `<span class="choice-letter">${letters[i]}</span><span>${text}</span>`;
    li.addEventListener('click', () => {
      if (answered) return;
      selectChoice(i, li);
    });
    choicesList.appendChild(li);
  });
}

function selectChoice(idx, el) {
  answered = true;
  const all = choicesList.querySelectorAll('.choice');
  all.forEach(c => c.style.pointerEvents = 'none');
  el.classList.add(idx === currentQ.answer ? 'correct' : 'wrong');
  all[currentQ.answer].classList.add('correct');
  showExplanation();
}

// ── 정답 표시 ────────────────────────────────────────────────────────────────
function revealAnswer() {
  if (answered) return;
  answered = true;
  const all = choicesList.querySelectorAll('.choice');
  all.forEach(c => c.style.pointerEvents = 'none');
  all[currentQ.answer].classList.add('correct');
  showAnswerBtn.disabled = true;
  showExplanation();
}

function showExplanation() {
  explanation.textContent = currentQ.explanation;
  explanation.classList.add('show');
}

// ── Stability AI 이미지 생성 ─────────────────────────────────────────────────
async function generateImage(q, forceRegen) {
  const cacheKey = q.imagePrompt;

  // 캐시 히트
  if (!forceRegen && imageCache[cacheKey]) {
    displayImage(imageCache[cacheKey]);
    return;
  }

  // 로딩 상태
  questionImg.src = '';
  imgError.style.display = 'none';
  regenBtn.style.display = 'none';
  imgOverlay.classList.remove('hidden');
  setStatus('🎨 AI가 TOEIC 시험 이미지를 생성하고 있습니다…');

  try {
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: q.imagePrompt,
        style: 'photographic',
        aspectRatio: '16:9',
      }),
    });

    const data = await res.json();

    if (!res.ok || !data.imageUrl) {
      throw new Error(data.error || 'Image generation failed');
    }

    imageCache[cacheKey] = data.imageUrl;
    displayImage(data.imageUrl);
    setStatus('');

  } catch (err) {
    console.error('Image generation error:', err);
    imgOverlay.classList.add('hidden');
    imgError.style.display = 'flex';
    regenBtn.style.display = 'flex';
    setStatus('⚠️ 이미지 생성에 실패했습니다. 재시도 버튼을 눌러주세요.');
  }
}

function displayImage(dataUrl) {
  questionImg.onload = () => {
    imgOverlay.classList.add('hidden');
    imgError.style.display = 'none';
    regenBtn.style.display = 'flex';
  };
  questionImg.src = dataUrl;
}

function setStatus(msg) {
  statusBar.textContent = msg;
}
</script>
</body>
</html>
