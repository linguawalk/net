<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaWalk — General English — Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1C2B45;--teal:#2A7F6F;--teal-mid:#1D9E75;--teal-light:#e1f5ee;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --bg:#F8F7F4;--white:#fff;--text:#1C2B45;--text-muted:#5a6a82;--text-light:#94a3b8;
  --border:rgba(28,43,69,0.1);--border-md:rgba(28,43,69,0.18);
  --green:#16a34a;--green-light:#dcfce7;
  --red:#e24b4a;--red-light:#fee2e2;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:rgba(28,43,69,0.97);height:56px;display:flex;align-items:center;padding:0 5%;border-bottom:0.5px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-lm{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.nav-lt{font-size:16px;font-weight:600;color:#fff;}
.nav-sep{width:1px;height:18px;background:rgba(255,255,255,0.15);margin:0 12px;}
.nav-page{font-size:13px;color:rgba(255,255,255,0.6);}
.nav-space{flex:1;}
.nav-back{font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none;padding:6px 10px;border-radius:7px;transition:all 0.2s;}
.nav-back:hover{background:rgba(255,255,255,0.08);color:#fff;}
.lang-sw{display:flex;background:rgba(255,255,255,0.08);border-radius:7px;padding:2px;gap:2px;margin-left:8px;}
.lbtn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;border:none;background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.lbtn.act{background:var(--teal-mid);color:#fff;}
.main{max-width:860px;margin:0 auto;padding:28px 5% 80px;}
.hero{background:linear-gradient(135deg,#2d0a6e 0%,var(--purple) 100%);border-radius:14px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;right:-20px;top:-20px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.07);pointer-events:none;}
.hero-tag{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:6px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:clamp(22px,4vw,30px);color:#fff;margin-bottom:6px;}
.hero-desc{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.6;}
.hero-badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.hero-badge{font-size:11px;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:0.5px solid rgba(255,255,255,0.2);}
.hero-badge.free{background:rgba(255,255,255,0.25);font-weight:700;}
.settings-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.setting-item{background:var(--white);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;flex:1;min-width:130px;}
.si-label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:6px;}
.si-select{width:100%;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text);font-family:inherit;cursor:pointer;outline:none;}
.gen-btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin-bottom:20px;}
.gen-btn:hover{background:#6d28d9;}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;}
.card{background:var(--white);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.card-head{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:600;color:var(--text);}
.card-body{padding:18px;}
/* Explanation */
.rule-box{background:var(--purple-light);border:0.5px solid rgba(124,58,237,0.2);border-radius:10px;padding:16px;margin-bottom:16px;}
.rb-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:8px;}
.rb-content{font-size:14px;color:var(--text);line-height:1.7;}
.example-box{background:var(--bg);border-radius:8px;padding:12px 14px;margin:8px 0;font-size:13px;color:var(--text-muted);font-style:italic;border-left:3px solid var(--purple);}
/* Fill blank */
.sentence-box{font-size:16px;line-height:2;color:var(--text);margin-bottom:16px;padding:16px;background:var(--bg);border-radius:10px;}
.blank{display:inline-block;min-width:80px;height:28px;border-bottom:2px solid var(--purple);background:transparent;padding:0 8px;font-size:15px;font-family:inherit;color:var(--text);outline:none;text-align:center;}
.blank.correct{border-color:var(--green);background:var(--green-light);color:var(--green);}
.blank.wrong{border-color:var(--red);background:var(--red-light);color:var(--red);}
/* MCQ */
.q-box{background:var(--bg);border-radius:10px;padding:16px;margin-bottom:12px;}
.q-text{font-size:15px;color:var(--text);margin-bottom:12px;line-height:1.5;}
.q-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt-btn{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;border:0.5px solid var(--border-md);background:var(--white);color:var(--text);cursor:pointer;font-family:inherit;transition:all 0.2s;text-align:left;}
.opt-btn:hover:not(:disabled){border-color:var(--purple);color:var(--purple);}
.opt-btn.correct{background:var(--green-light);border-color:var(--green);color:var(--green);}
.opt-btn.wrong{background:var(--red-light);border-color:var(--red);color:var(--red);}
.opt-btn:disabled{cursor:default;}
.feedback-box{padding:12px 14px;border-radius:8px;font-size:13px;margin-top:8px;display:none;}
.fb-correct{background:var(--green-light);color:var(--green);}
.fb-wrong{background:var(--red-light);color:var(--red);}
.score-bar{display:flex;align-items:center;gap:12px;background:var(--white);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;}
.score-num{font-family:'DM Serif Display',serif;font-size:24px;color:var(--purple);}
.score-label{font-size:12px;color:var(--text-muted);}
.progress-bar{flex:1;height:8px;background:var(--bg);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),#a855f7);border-radius:10px;transition:width 0.3s;}
.submit-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;margin-top:8px;}
.result-box{text-align:center;padding:24px;background:var(--white);border:0.5px solid var(--border);border-radius:14px;display:none;}
.rb-icon2{font-size:48px;margin-bottom:12px;}
.rb-title2{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text);margin-bottom:6px;}
.rb-score2{font-size:16px;color:var(--purple);font-weight:600;margin-bottom:16px;}
.rb-btn{padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;}
.mode-tabs{display:flex;gap:0;background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;}
.mode-tab{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);font-family:inherit;transition:all 0.2s;text-align:center;}
.mode-tab.act{background:var(--purple);color:#fff;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.3s ease forwards;}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="nav-logo">
    <div class="nav-lm">LW</div>
    <span class="nav-lt">LinguaWalk</span>
  </a>
  <div class="nav-sep"></div>
  <span class="nav-page" data-en="General · Grammar" data-ko="General · 문법">General · Grammar</span>
  <div class="nav-space"></div>
  <a href="../index.html" class="nav-back" data-en="← English" data-ko="← 영어">← English</a>
  <div class="lang-sw">
    <button class="lbtn act" onclick="setLang('en')" id="btn-en">EN</button>
    <button class="lbtn" onclick="setLang('ko')" id="btn-ko">한국어</button>
  </div>
</nav>

<div class="main">
  <div class="hero fade-in">
    <div class="hero-tag">GENERAL ENGLISH</div>
    <div class="hero-title" data-en="✏️ Grammar" data-ko="✏️ 문법">✏️ Grammar</div>
    <div class="hero-desc" data-en="Master English grammar rules with explanations and practice exercises. AI-generated for your level." data-ko="설명과 연습 문제로 영어 문법을 마스터하세요. 레벨에 맞게 AI가 생성합니다.">Master English grammar with explanations and practice exercises.</div>
    <div class="hero-badges">
      <span class="hero-badge free">✓ 100% Free</span>
      <span class="hero-badge">A1 → C2</span>
      <span class="hero-badge">🤖 AI-Generated</span>
      <span class="hero-badge">Explanation + Practice</span>
    </div>
  </div>

  <div class="settings-row fade-in">
    <div class="setting-item">
      <div class="si-label" data-en="Level" data-ko="레벨">Level</div>
      <select class="si-select" id="sel-level">
        <option value="A1">A1 — Beginner</option>
        <option value="A2">A2 — Elementary</option>
        <option value="B1" selected>B1 — Intermediate</option>
        <option value="B2">B2 — Upper-Intermediate</option>
        <option value="C1">C1 — Advanced</option>
        <option value="C2">C2 — Mastery</option>
      </select>
    </div>
    <div class="setting-item">
      <div class="si-label" data-en="Topic" data-ko="주제">Topic</div>
      <select class="si-select" id="sel-topic">
        <option value="present tenses">Present Tenses</option>
        <option value="past tenses">Past Tenses</option>
        <option value="future tenses">Future Tenses</option>
        <option value="conditionals">Conditionals</option>
        <option value="passive voice">Passive Voice</option>
        <option value="articles">Articles (a/an/the)</option>
        <option value="prepositions">Prepositions</option>
        <option value="modal verbs">Modal Verbs</option>
        <option value="relative clauses">Relative Clauses</option>
        <option value="reported speech">Reported Speech</option>
      </select>
    </div>
    <div class="setting-item">
      <div class="si-label" data-en="Mode" data-ko="모드">Mode</div>
      <select class="si-select" id="sel-mode" onchange="syncMode(this.value)">
        <option value="explain">Explanation + Examples</option>
        <option value="mcq">Multiple Choice</option>
        <option value="fill">Fill in the Blank</option>
      </select>
    </div>
  </div>

  <button class="gen-btn fade-in" id="gen-btn" onclick="generate()">
    🤖 <span data-en="Generate Grammar Lesson" data-ko="문법 학습 생성">Generate Grammar Lesson</span>
  </button>

  <div class="score-bar fade-in" id="score-bar" style="display:none;">
    <div>
      <div class="score-num" id="score-num">0 / 0</div>
      <div class="score-label" data-en="Correct" data-ko="정답">Correct</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div id="content-area"></div>

  <div class="result-box fade-in" id="result-box">
    <div class="rb-icon2" id="rb-icon">🎉</div>
    <div class="rb-title2" id="rb-title">완료!</div>
    <div class="rb-score2" id="rb-score"></div>
    <button class="rb-btn" onclick="generate()" data-en="🔄 New Lesson" data-ko="🔄 새 학습">🔄 New Lesson</button>
  </div>
</div>

<script>
let lang = localStorage.getItem('lw-lang')||'ko';
let questions=[], currentIdx=0, score=0, answered=0;

function setLang(l){
  lang=l;
  document.querySelectorAll('[data-en][data-ko]').forEach(el=>el.innerHTML=l==='ko'?el.dataset.ko:el.dataset.en);
  document.getElementById('btn-en').classList.toggle('act',l==='en');
  document.getElementById('btn-ko').classList.toggle('act',l==='ko');
  localStorage.setItem('lw-lang',l);
}
setLang(lang);

function syncMode(v){ document.getElementById('sel-mode').value=v; }

async function generate(){
  const level=document.getElementById('sel-level').value;
  const topic=document.getElementById('sel-topic').value;
  const mode=document.getElementById('sel-mode').value;
  const btn=document.getElementById('gen-btn');
  btn.disabled=true;
  btn.innerHTML='⏳ <span>'+(lang==='ko'?'생성 중...':'Generating...')+'</span>';
  document.getElementById('content-area').innerHTML='';
  document.getElementById('result-box').style.display='none';
  document.getElementById('score-bar').style.display='none';
  questions=[];currentIdx=0;score=0;answered=0;

  let prompt='';
  if(mode==='explain'){
    prompt=`Create a grammar lesson about "${topic}" for ${level} level English learners.
Return ONLY valid JSON, no markdown:
{
  "title": "Grammar Topic Title",
  "explanation": "Clear explanation of the grammar rule (2-3 paragraphs)",
  "key_points": ["point 1", "point 2", "point 3"],
  "examples": [
    {"sentence": "example sentence", "note": "why this is correct"},
    {"sentence": "example sentence 2", "note": "explanation"}
  ],
  "common_mistakes": [
    {"wrong": "incorrect example", "correct": "correct example", "note": "explanation"}
  ],
  "korean_note": "Brief Korean explanation of the main concept"
}`;
  } else if(mode==='mcq'){
    prompt=`Create 5 multiple choice grammar questions about "${topic}" for ${level} level.
Return ONLY valid JSON array, no markdown:
[
  {
    "question": "Choose the correct form: She ___ to school every day.",
    "options": ["go", "goes", "going", "gone"],
    "answer": "goes",
    "explanation": "We use 's' with third person singular in present simple."
  }
]`;
  } else {
    prompt=`Create 5 fill-in-the-blank grammar exercises about "${topic}" for ${level} level.
Return ONLY valid JSON array, no markdown:
[
  {
    "sentence": "She ___ (go) to school every day.",
    "answer": "goes",
    "hint": "Present simple, 3rd person singular",
    "explanation": "We add -s/-es to verbs with he/she/it in present simple."
  }
]`;
  }

  try {
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const text=data.content[0].text;
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    if(mode==='explain') renderExplanation(parsed);
    else if(mode==='mcq'){questions=parsed;renderMCQ(0);}
    else{questions=parsed;renderFill();}
  } catch(e){
    document.getElementById('content-area').innerHTML=`<div style="text-align:center;padding:24px;color:var(--red);">❌ ${lang==='ko'?'생성 실패. 다시 시도해 주세요.':'Generation failed.'}</div>`;
  }
  btn.disabled=false;
  btn.innerHTML='🔄 <span>'+(lang==='ko'?'새로 생성':'Regenerate')+'</span>';
}

function renderExplanation(d){
  const area=document.getElementById('content-area');
  area.innerHTML=`
    <div class="card fade-in">
      <div class="card-head"><span class="card-title">${d.title}</span></div>
      <div class="card-body">
        <div class="rule-box">
          <div class="rb-title">📖 ${lang==='ko'?'문법 규칙':'Grammar Rule'}</div>
          <div class="rb-content">${d.explanation}</div>
        </div>
        ${d.korean_note?`<div style="background:#fef3c7;border:0.5px solid #f59e0b;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;color:#92400e;">🇰🇷 ${d.korean_note}</div>`:''}
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin-bottom:8px;">${lang==='ko'?'핵심 포인트':'Key Points'}</div>
        ${d.key_points.map(p=>`<div style="display:flex;gap:8px;margin-bottom:6px;font-size:13px;"><span style="color:var(--purple);">✓</span><span>${p}</span></div>`).join('')}
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin:14px 0 8px;">${lang==='ko'?'예문':'Examples'}</div>
        ${d.examples.map(e=>`<div class="example-box"><div style="font-weight:600;margin-bottom:4px;">${e.sentence}</div><div style="font-size:12px;color:var(--text-light);">${e.note}</div></div>`).join('')}
        ${d.common_mistakes&&d.common_mistakes.length?`
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin:14px 0 8px;">${lang==='ko'?'자주 하는 실수':'Common Mistakes'}</div>
        ${d.common_mistakes.map(m=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div style="padding:10px;background:var(--red-light);border-radius:8px;font-size:13px;"><span style="color:var(--red);font-weight:700;">✗ </span>${m.wrong}</div>
          <div style="padding:10px;background:var(--green-light);border-radius:8px;font-size:13px;"><span style="color:var(--green);font-weight:700;">✓ </span>${m.correct}</div>
        </div><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${m.note}</div>`).join('')}`:''}
      </div>
    </div>`;
}

function renderMCQ(idx){
  currentIdx=idx;
  const q=questions[idx];
  document.getElementById('score-bar').style.display='flex';
  updateScore();
  const area=document.getElementById('content-area');
  area.innerHTML=`
    <div class="card fade-in">
      <div class="card-head"><span class="card-title">${lang==='ko'?'문제':'Question'} ${idx+1} / ${questions.length}</span></div>
      <div class="card-body">
        <div class="q-text">${q.question}</div>
        <div class="q-options">
          ${q.options.map(o=>`<button class="opt-btn" onclick="checkMCQ(this,'${o}','${q.answer}','${q.explanation.replace(/'/g,"\\'")}',${idx})">${o}</button>`).join('')}
        </div>
        <div class="feedback-box" id="feedback"></div>
      </div>
    </div>`;
}

function checkMCQ(btn,chosen,correct,explanation,idx){
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  if(chosen===correct){btn.classList.add('correct');score++;fb.className='feedback-box fb-correct';fb.textContent='✓ '+explanation;}
  else{btn.classList.add('wrong');document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});fb.className='feedback-box fb-wrong';fb.textContent='✗ '+explanation;}
  fb.style.display='block';answered++;updateScore();
  setTimeout(()=>{if(idx<questions.length-1)renderMCQ(idx+1);else showResult();},1500);
}

function renderFill(){
  document.getElementById('score-bar').style.display='flex';
  updateScore();
  const area=document.getElementById('content-area');
  area.innerHTML=`<div class="card fade-in"><div class="card-head"><span class="card-title">${lang==='ko'?'빈칸 채우기':'Fill in the Blanks'}</span></div><div class="card-body">
    ${questions.map((q,i)=>`
      <div style="margin-bottom:18px;padding-bottom:18px;border-bottom:0.5px solid var(--border);">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">${i+1}. <em>${q.hint}</em></div>
        <div class="sentence-box">${q.sentence.replace('___',`<input class="blank" id="blank-${i}" type="text" placeholder="?">`)}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="submit-btn" onclick="checkFill(${i},'${q.answer}','${q.explanation.replace(/'/g,"\\'")}')">
            ${lang==='ko'?'확인':'Check'}
          </button>
          <span id="feedback-${i}" style="font-size:13px;"></span>
        </div>
      </div>`).join('')}
    <button class="gen-btn" style="margin-top:8px;" onclick="generate()">🔄 ${lang==='ko'?'새 연습':'New Exercise'}</button>
  </div></div>`;
}

function checkFill(idx,answer,explanation){
  const input=document.getElementById(`blank-${idx}`);
  const fb=document.getElementById(`feedback-${idx}`);
  const val=input.value.trim().toLowerCase();
  input.disabled=true;
  if(val===answer.toLowerCase()){
    input.classList.add('correct');
    fb.style.color='var(--green)';
    fb.textContent='✓ '+explanation;
    score++;
  } else {
    input.classList.add('wrong');
    fb.style.color='var(--red)';
    fb.textContent=`✗ ${lang==='ko'?'정답:':'Answer:'} ${answer} — ${explanation}`;
  }
  answered++;
  updateScore();
}

function updateScore(){
  const fill=document.getElementById('progress-fill');
  const num=document.getElementById('score-num');
  if(fill) fill.style.width=`${(answered/questions.length)*100}%`;
  if(num) num.textContent=`${score} / ${questions.length}`;
}

function showResult(){
  const pct=Math.round(score/questions.length*100);
  const box=document.getElementById('result-box');
  box.style.display='block';
  document.getElementById('rb-icon').textContent=pct>=80?'🎉':pct>=60?'👍':'💪';
  document.getElementById('rb-title').textContent=pct>=80?(lang==='ko'?'훌륭해요!':'Excellent!'):(pct>=60?(lang==='ko'?'잘했어요!':'Good job!'):(lang==='ko'?'계속 연습하세요!':'Keep practicing!'));
  document.getElementById('rb-score').textContent=`${score} / ${questions.length} (${pct}%)`;
}
</script>
</body>
</html>
