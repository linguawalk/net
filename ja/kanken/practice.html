<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaWalk — 漢検 練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1C2B45;--teal:#2A7F6F;--teal-mid:#1D9E75;--teal-light:#e1f5ee;
  --gold:#b07c1a;--gold-dark:#5a4208;--gold-light:#fdf3dc;--gold-mid:#d4960a;
  --bg:#F8F7F4;--white:#fff;--text:#1C2B45;--text-muted:#5a6a82;--text-light:#94a3b8;
  --border:rgba(28,43,69,0.1);--border-md:rgba(28,43,69,0.18);
  --green:#16a34a;--green-light:#dcfce7;
  --red:#e24b4a;--red-light:#fee2e2;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:rgba(28,43,69,0.97);height:56px;display:flex;align-items:center;padding:0 5%;border-bottom:0.5px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-lm{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.nav-lt{font-size:16px;font-weight:600;color:#fff;}
.nav-sep{width:1px;height:18px;background:rgba(255,255,255,0.15);margin:0 12px;}
.nav-page{font-size:13px;color:rgba(255,255,255,0.6);}
.nav-space{flex:1;}
.nav-back{font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none;padding:6px 10px;border-radius:7px;transition:all 0.2s;}
.nav-back:hover{background:rgba(255,255,255,0.08);color:#fff;}
.lang-sw{display:flex;background:rgba(255,255,255,0.08);border-radius:7px;padding:2px;gap:2px;margin-left:8px;}
.lbtn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;border:none;background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.lbtn.act{background:var(--teal-mid);color:#fff;}
.main{max-width:820px;margin:0 auto;padding:28px 5% 80px;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--gold-dark) 0%,var(--gold) 100%);border-radius:14px;padding:22px 28px;margin-bottom:20px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;right:-20px;top:-20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.07);pointer-events:none;}
.hero-grade{font-family:'DM Serif Display',serif;font-size:36px;color:#fcd34d;line-height:1;margin-bottom:4px;}
.hero-title{font-size:14px;color:rgba(255,255,255,0.75);margin-bottom:10px;}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;}
.h-badge{font-size:11px;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:0.5px solid rgba(255,255,255,0.2);}

/* DOMAIN TABS */
.domain-tabs{display:flex;background:var(--white);border:0.5px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;gap:3px;overflow-x:auto;}
.dtab{flex:1;padding:9px 8px;border-radius:9px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);font-family:inherit;transition:all 0.2s;text-align:center;white-space:nowrap;min-width:64px;}
.dtab:hover{color:var(--gold);}
.dtab.act{background:var(--gold);color:#fff;}

/* SETTINGS */
.settings-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.setting-item{background:var(--white);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;flex:1;min-width:120px;}
.si-label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:6px;}
.si-select{width:100%;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text);font-family:inherit;cursor:pointer;outline:none;}

/* GEN BTN */
.gen-btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;background:var(--gold);color:#fff;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s;margin-bottom:20px;}
.gen-btn:hover{background:var(--gold-dark);}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;}

/* LOADING */
.loading{padding:40px;text-align:center;background:var(--white);border:0.5px solid var(--border);border-radius:14px;margin-bottom:16px;display:none;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARD */
.card{background:var(--white);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.card-head{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;color:var(--text);}
.card-body{padding:18px;}

/* FLASHCARD */
.fc-wrap{perspective:1000px;margin-bottom:14px;}
.flashcard{width:100%;min-height:180px;position:relative;transform-style:preserve-3d;transition:transform 0.5s;cursor:pointer;border-radius:14px;}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:14px;padding:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.fc-front{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#fff;}
.fc-back{background:var(--white);border:0.5px solid var(--border);transform:rotateY(180deg);}
.fc-kanji{font-size:72px;line-height:1;margin-bottom:8px;font-family:'DM Serif Display',serif;}
.fc-grade-badge{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,0.2);margin-bottom:12px;}
.fc-hint{font-size:12px;opacity:.55;margin-top:auto;}
.fc-reading{font-size:28px;font-weight:600;color:var(--gold);margin-bottom:8px;}
.fc-meaning{font-size:15px;color:var(--text);margin-bottom:8px;}
.fc-example{font-size:13px;color:var(--text-muted);line-height:1.65;background:var(--bg);padding:8px 12px;border-radius:8px;width:100%;}
.nav-btns{display:flex;gap:10px;margin-top:8px;}
.nav-btn{flex:1;padding:12px;border-radius:10px;border:0.5px solid var(--border-md);background:var(--white);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.nav-btn:disabled{opacity:.4;cursor:default;}
.nav-btn.primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.nav-btn.primary:hover{background:var(--gold-dark);}

/* QUIZ */
.q-item{margin-bottom:12px;padding:14px;background:var(--bg);border-radius:10px;}
.q-item:last-child{margin-bottom:0;}
.q-num{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-bottom:8px;}
.q-kanji-big{font-size:48px;text-align:center;margin-bottom:10px;line-height:1.2;}
.q-text{font-size:14px;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.6;}
.q-opts{display:flex;flex-direction:column;gap:6px;}
.q-opt{padding:9px 14px;border-radius:8px;border:1.5px solid var(--border-md);background:var(--white);cursor:pointer;font-size:14px;color:var(--text);transition:all 0.2s;text-align:left;font-family:inherit;display:flex;align-items:center;gap:10px;}
.q-opt:hover:not(:disabled){border-color:var(--gold);background:var(--gold-light);}
.q-opt.correct{border-color:var(--green);background:var(--green-light);color:#166534;font-weight:500;}
.q-opt.wrong{border-color:var(--red);background:var(--red-light);color:#991b1b;}
.q-opt-ltr{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-muted);flex-shrink:0;}
.q-opt.correct .q-opt-ltr{background:var(--green);color:#fff;}
.q-opt.wrong .q-opt-ltr{background:var(--red);color:#fff;}
.q-feedback{margin-top:8px;font-size:12px;padding:8px 12px;border-radius:7px;display:none;line-height:1.5;}
.q-feedback.show{display:block;}
.q-feedback.correct{background:var(--green-light);color:#166534;}
.q-feedback.wrong{background:var(--red-light);color:#991b1b;}

/* FILL (書き) */
.fill-wrap{text-align:center;padding:24px;background:linear-gradient(135deg,var(--gold-dark),var(--gold));border-radius:14px;margin-bottom:14px;color:#fff;}
.fill-reading{font-size:32px;font-weight:700;margin-bottom:8px;}
.fill-hint{font-size:14px;opacity:.75;margin-bottom:16px;}
.fill-input{font-size:28px;border:2px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.15);color:#fff;padding:10px 20px;border-radius:10px;text-align:center;font-family:inherit;outline:none;width:160px;}
.fill-input::placeholder{color:rgba(255,255,255,0.4);}
.fill-input:focus{border-color:#fff;}
.fill-submit{margin-top:12px;padding:10px 28px;border-radius:9px;background:rgba(255,255,255,0.2);color:#fff;border:0.5px solid rgba(255,255,255,0.3);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all 0.2s;}
.fill-submit:hover{background:rgba(255,255,255,0.3);}
.fill-result{margin-top:12px;font-size:16px;font-weight:600;display:none;}

/* SCORE */
.score-bar{display:flex;align-items:center;gap:12px;background:var(--white);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:none;}
.sb-num{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold);}
.sb-bar{flex:1;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;}
.sb-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));border-radius:6px;transition:width 0.3s;}
.score-card{background:linear-gradient(135deg,var(--gold-dark),var(--gold));border-radius:14px;padding:24px;text-align:center;margin-bottom:20px;display:none;color:#fff;}
.sc-score{font-family:'DM Serif Display',serif;font-size:52px;line-height:1;margin-bottom:6px;}
.sc-msg{font-size:13px;color:#fcd34d;font-weight:500;}

.action-btns{display:flex;gap:10px;display:none;}
.act-btn{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border:0.5px solid var(--border-md);background:var(--white);color:var(--text);transition:all 0.2s;text-decoration:none;text-align:center;}
.act-btn.primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.act-btn.primary:hover{background:var(--gold-dark);}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.4s ease forwards;}
</style>
</head>
<body>
<nav>
  <a href="../../index.html" class="nav-logo">
    <div class="nav-lm">LW</div>
    <span class="nav-lt">LinguaWalk</span>
  </a>
  <div class="nav-sep"></div>
  <span class="nav-page" id="nav-page">🖊️ 漢検 練習</span>
  <div class="nav-space"></div>
  <a href="index.html" class="nav-back" data-ko="← 漢検 홈" data-ja="← 漢検ホーム">← 漢検 홈</a>
  <div class="lang-sw">
    <button class="lbtn act" onclick="setLang('ko')" id="btn-ko">한국어</button>
    <button class="lbtn" onclick="setLang('ja')" id="btn-ja">日本語</button>
  </div>
</nav>

<div class="main fade-in">
  <!-- 히어로 -->
  <div class="hero">
    <div class="hero-grade" id="hero-grade">4級</div>
    <div class="hero-title" id="hero-title" data-ko="漢検 4급 연습" data-ja="漢検4級練習">漢検 4급 연습</div>
    <div class="hero-badges">
      <span class="h-badge" id="hero-chars" data-ko="1,322자" data-ja="1,322字">1,322자</span>
      <span class="h-badge">🤖 AI</span>
    </div>
  </div>

  <!-- 영역 탭 -->
  <div class="domain-tabs">
    <button class="dtab act" onclick="selectDomain('yomi',this)" data-ko="📖 読み" data-ja="📖 読み">📖 読み</button>
    <button class="dtab" onclick="selectDomain('kaki',this)" data-ko="✏️ 書き" data-ja="✏️ 書き">✏️ 書き</button>
    <button class="dtab" onclick="selectDomain('bushu',this)" data-ko="🔍 部首" data-ja="🔍 部首">🔍 部首</button>
    <button class="dtab" onclick="selectDomain('jukugo',this)" data-ko="📚 熟語" data-ja="📚 熟語">📚 熟語</button>
    <button class="dtab" onclick="selectDomain('taikugi',this)" data-ko="↔️ 対義語" data-ja="↔️ 対義語">↔️ 対義語</button>
    <button class="dtab" onclick="selectDomain('okuri',this)" data-ko="🈶 送り仮名" data-ja="🈶 送り仮名">🈶 送り仮名</button>
  </div>

  <!-- 설정 -->
  <div class="settings-row">
    <div class="setting-item">
      <div class="si-label" data-ko="학습 모드" data-ja="学習モード">학습 모드</div>
      <select class="si-select" id="sel-mode">
        <option value="flashcard" data-ko="🃏 플래시카드" data-ja="🃏 フラッシュカード">🃏 플래시카드</option>
        <option value="quiz" data-ko="📝 4지선다 퀴즈" data-ja="📝 4択クイズ">📝 4지선다 퀴즈</option>
        <option value="fill" data-ko="✏️ 직접 쓰기" data-ja="✏️ 書き取り">✏️ 직접 쓰기 (書き域)</option>
      </select>
    </div>
    <div class="setting-item">
      <div class="si-label" data-ko="문제 수" data-ja="問題数">문제 수</div>
      <select class="si-select" id="sel-count">
        <option value="5" selected>5</option>
        <option value="8">8</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">
    🤖 <span data-ko="문제 생성" data-ja="問題を生成">문제 생성</span>
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:var(--text-muted);" id="loading-text">생성 중...</div>
  </div>

  <div class="score-bar" id="score-bar">
    <div><div class="sb-num" id="sb-num">0 / 0</div><div style="font-size:11px;color:var(--text-muted);">正解</div></div>
    <div class="sb-bar"><div class="sb-fill" id="sb-fill" style="width:0%"></div></div>
  </div>

  <div id="content-area"></div>

  <div class="score-card" id="score-card">
    <div class="sc-score" id="sc-score"></div>
    <div style="font-size:14px;color:rgba(255,255,255,.7);margin-bottom:10px;" id="sc-pct"></div>
    <div class="sc-msg" id="sc-msg"></div>
  </div>

  <div class="action-btns" id="action-btns">
    <button class="act-btn primary" onclick="generate()" data-ko="🔄 새 문제" data-ja="🔄 新しい問題">🔄 새 문제</button>
    <a href="index.html" class="act-btn" data-ko="← 漢検 홈" data-ja="← 漢検ホーム">← 漢検 홈</a>
  </div>
</div>

<script>
let lang='ko', grade='4', domain='yomi';
let items=[], currentIdx=0, correct=0, answered=0;

const GRADE_META={
  '10':{label:'10級',chars:'80字',ko:'10급 — 小学1年 (80자)'},
  '9': {label:'9級', chars:'240字',ko:'9급 — 小学2年 (240자)'},
  '8': {label:'8級', chars:'440字',ko:'8급 — 小学3年 (440자)'},
  '7': {label:'7級', chars:'642字',ko:'7급 — 小学4年 (642자)'},
  '6': {label:'6級', chars:'825字',ko:'6급 — 小학5年 (825자)'},
  '5': {label:'5級', chars:'1,006字',ko:'5급 — 小学6年 (1,006자)'},
  '4': {label:'4級', chars:'1,322字',ko:'4급 — 中学1·2年 (1,322자)'},
  '3': {label:'3級', chars:'1,607字',ko:'3급 — 中学졸업 (1,607자)'},
  'j2':{label:'準2級',chars:'1,940字',ko:'準2급 — 高校재학 (1,940자)'},
  '2': {label:'2級', chars:'2,136字',ko:'2급 — 高校졸업 (2,136자)'},
  'j1':{label:'準1級',chars:'3,000字+',ko:'準1급 — 대학·사회인 (3,000자+)'},
  '1': {label:'1級', chars:'6,355字',ko:'1급 — 최고급 (6,355자)'},
};

// ── 영역 탭 ───────────────────────────────────────────────────────────
function selectDomain(d, btn){
  domain=d;
  document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('act'));
  btn.classList.add('act');
  resetContent();
  // 書き는 fill 모드가 더 어울리지만 선택 가능하게 유지
}

function resetContent(){
  document.getElementById('content-area').innerHTML='';
  document.getElementById('score-card').style.display='none';
  document.getElementById('action-btns').style.display='none';
  document.getElementById('score-bar').style.display='none';
  items=[]; currentIdx=0; correct=0; answered=0;
}

// ── API ───────────────────────────────────────────────────────────────
async function callClaude(prompt, maxTok){
  const r=await fetch('/api/claude',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:maxTok||1500,
      messages:[{role:'user',content:prompt}]})});
  const d=await r.json();
  const raw=d.content?.[0]?.text||'';
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

// ── 생성 ─────────────────────────────────────────────────────────────
async function generate(){
  resetContent();
  document.getElementById('gen-btn').disabled=true;
  document.getElementById('loading').style.display='block';
  document.getElementById('loading-text').textContent=lang==='ko'?'🤖 문제 생성 중…':'🤖 問題を生成中…';
  const count=parseInt(document.getElementById('sel-count').value)||5;
  const mode=document.getElementById('sel-mode').value;

  try{
    const data=await callClaude(buildPrompt(domain,grade,count,mode),1800);
    items=data.items||[];
    document.getElementById('loading').style.display='none';
    if(mode==='flashcard') renderFlashcards();
    else if(mode==='fill') renderFill();
    else renderQuiz();
    document.getElementById('score-bar').style.display='flex';
    document.getElementById('action-btns').style.display='flex';
    updateScoreBar();
  }catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('content-area').innerHTML=`<div style="padding:24px;text-align:center;color:var(--red)">⚠️ ${lang==='ko'?'생성 실패':'生成失敗'}<br><small>${e.message}</small></div>`;
    console.error(e);
  }
  document.getElementById('gen-btn').disabled=false;
}

// ── 프롬프트 ─────────────────────────────────────────────────────────
function buildPrompt(dom,g,count,mode){
  const meta=GRADE_META[g];
  const gradeLabel=meta?.label||g+'級';
  const domMap={
    yomi:'読み (한자→히라가나 읽기)',
    kaki:'書き (히라가나→한자 쓰기)',
    bushu:'部首 (한자의 부수)',
    jukugo:'熟語 (한자 숙어·四字熟語)',
    taikugi:'対義語・類義語 (반의어·유의어)',
    okuri:'送り仮名 (오쿠리가나)'
  };

  return `漢字検定 ${gradeLabel} ${domMap[dom]} 問題を${count}問生成してください。
ONLY return valid JSON (no markdown, single-line strings):
{"items":[
  {"id":1,
   "kanji":"漢字または熟語",
   "reading":"よみかた",
   "meaning_ja":"日本語の意味",
   "meaning_ko":"한국어 뜻",
   "example_ja":"例文",
   "bushu":"部首 (bushu領域のみ必要)",
   "question":"問題文 (日本語)",
   "choices":["1 選択肢","2 選択肢","3 選択肢","4 選択肢"],
   "answer":0,
   "explanation_ko":"한국어 해설"}
]}
Rules:
- ${gradeLabel}レベルの適切な漢字を使用
- answer は 0-based index (vary positions, not always 0)
- 選択肢は必ず4つ
- single-line strings only`;
}

// ── 플래시카드 ────────────────────────────────────────────────────────
function renderFlashcards(){
  currentIdx=0;
  showFlashcard(0);
}

function showFlashcard(idx){
  currentIdx=idx;
  const w=items[idx];
  const area=document.getElementById('content-area');
  const fc=document.createElement('div'); fc.className='fc-wrap fade-in';
  fc.innerHTML=`
    <div class="flashcard" id="fc" onclick="this.classList.toggle('flipped')">
      <div class="fc-front">
        <div class="fc-grade-badge">${GRADE_META[grade]?.label||grade+'級'} · ${domain==='yomi'?'読み':domain==='kaki'?'書き':domain==='bushu'?'部首':domain==='jukugo'?'熟語':domain==='taikugi'?'対義語':'送り仮名'}</div>
        <div class="fc-kanji">${w.kanji}</div>
        <div class="fc-hint">${lang==='ko'?'클릭해서 뒤집기 👆':'クリックして裏返す 👆'}</div>
      </div>
      <div class="fc-back">
        <div class="fc-reading">${w.reading}</div>
        <div class="fc-meaning">${w.meaning_ja}</div>
        <div style="font-size:13px;color:var(--gold);font-weight:600;margin-bottom:8px;">${w.meaning_ko}</div>
        ${w.example_ja?`<div class="fc-example">${w.example_ja}</div>`:''}
        ${w.bushu?`<div style="margin-top:8px;font-size:12px;color:var(--text-muted);">部首: ${w.bushu}</div>`:''}
      </div>
    </div>`;

  const btns=document.createElement('div'); btns.className='nav-btns';
  const prev=document.createElement('button'); prev.className='nav-btn';
  prev.textContent='← '+(lang==='ko'?'이전':'前へ');
  if(idx===0) prev.disabled=true;
  prev.addEventListener('click',()=>showFlashcard(idx-1));
  const next=document.createElement('button'); next.className='nav-btn primary';
  next.textContent=idx===items.length-1?(lang==='ko'?'완료 ✓':'完了 ✓'):(lang==='ko'?'다음 →':'次へ →');
  next.addEventListener('click',()=>{ if(idx<items.length-1) showFlashcard(idx+1); else showResult(items.length,items.length); });
  btns.append(prev,next);

  area.innerHTML=''; area.append(fc,btns);
  updateScoreBar(idx+1,items.length,idx+1,items.length);
}

// ── 퀴즈 ─────────────────────────────────────────────────────────────
function renderQuiz(){
  const card=document.createElement('div'); card.className='card fade-in';
  const head=document.createElement('div'); head.className='card-head';
  head.innerHTML=`<span class="card-title">${GRADE_META[grade]?.label||grade+'級'} ${lang==='ko'?'퀴즈':'クイズ'} (${items.length}${lang==='ko'?'문제':'問'})</span>`;
  const body=document.createElement('div'); body.className='card-body';

  items.forEach(item=>{
    const qDiv=document.createElement('div'); qDiv.className='q-item';
    const qNum=document.createElement('div'); qNum.className='q-num'; qNum.textContent='問 '+item.id;
    const qKanji=document.createElement('div'); qKanji.className='q-kanji-big'; qKanji.textContent=item.kanji;
    const qText=document.createElement('div'); qText.className='q-text'; qText.textContent=item.question;
    const opts=document.createElement('div'); opts.className='q-opts';
    item.choices.forEach((c,i)=>{
      const btn=document.createElement('button'); btn.className='q-opt';
      btn.innerHTML=`<span class="q-opt-ltr">${i+1}</span><span>${c}</span>`;
      btn.addEventListener('click',()=>answerQ(item.id,i,btn,item.answer,item.explanation_ko,opts));
      opts.appendChild(btn);
    });
    const fb=document.createElement('div'); fb.className='q-feedback'; fb.id='kfb-'+item.id;
    qDiv.append(qNum,qKanji,qText,opts,fb);
    body.appendChild(qDiv);
  });
  card.append(head,body);
  document.getElementById('content-area').appendChild(card);
}

// ── 書き取り (직접 입력) ──────────────────────────────────────────────
function renderFill(){
  currentIdx=0;
  showFillItem(0);
}

function showFillItem(idx){
  currentIdx=idx;
  const item=items[idx];
  const area=document.getElementById('content-area');

  const wrap=document.createElement('div'); wrap.className='fade-in';
  const fillWrap=document.createElement('div'); fillWrap.className='fill-wrap';
  fillWrap.innerHTML=`
    <div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">${idx+1} / ${items.length}</div>
    <div class="fill-reading">${item.reading}</div>
    <div class="fill-hint">${lang==='ko'?'위 읽기에 해당하는 한자를 입력하세요':'上の読みに対応する漢字を入力してください'}</div>
    <input type="text" class="fill-input" id="fill-input" placeholder="${lang==='ko'?'한자 입력':'漢字を入力'}" autocomplete="off" maxlength="6">
    <br>
    <button class="fill-submit" onclick="checkFill('${item.kanji}','${item.meaning_ko}',${idx})">${lang==='ko'?'확인 →':'確認 →'}</button>
    <div class="fill-result" id="fill-result"></div>`;
  const meaning=document.createElement('div');
  meaning.style.cssText='margin-top:12px;font-size:12px;color:rgba(255,255,255,0.55);';
  meaning.textContent=lang==='ko'?'뜻: '+item.meaning_ko:'意味: '+item.meaning_ja;

  fillWrap.appendChild(meaning);
  wrap.appendChild(fillWrap);
  area.innerHTML=''; area.appendChild(wrap);

  // 엔터키 지원
  setTimeout(()=>{
    const inp=document.getElementById('fill-input');
    if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') checkFill(item.kanji,item.meaning_ko,idx); }); }
  },100);
}

function checkFill(correct_kanji, meaning_ko, idx){
  const inp=document.getElementById('fill-input');
  const res=document.getElementById('fill-result');
  if(!inp||!res) return;
  const val=inp.value.trim();
  const isOk=val===correct_kanji;
  res.style.display='block';
  res.style.color=isOk?'#fcd34d':'#fca5a5';
  res.textContent=isOk?`✅ 正解！ ${correct_kanji} (${meaning_ko})`:`❌ 不正解。正解: ${correct_kanji} (${meaning_ko})`;
  inp.disabled=true;
  if(isOk) correct++;
  answered++;
  updateScoreBar(answered,items.length,correct,items.length);

  // 다음 문제 버튼 추가
  const nextBtn=document.createElement('button');
  nextBtn.style.cssText='margin-top:12px;padding:9px 24px;border-radius:9px;background:rgba(255,255,255,0.2);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;';
  nextBtn.textContent=idx<items.length-1?(lang==='ko'?'다음 →':'次へ →'):(lang==='ko'?'결과 보기':'結果を見る');
  nextBtn.addEventListener('click',()=>{
    if(idx<items.length-1) showFillItem(idx+1);
    else showResult(correct,items.length);
  });
  document.querySelector('.fill-wrap').appendChild(nextBtn);
}

// ── 답변·점수 ─────────────────────────────────────────────────────────
function answerQ(qId,idx,btn,answer,expl,optsEl){
  const opts=optsEl?.querySelectorAll('.q-opt'); if(!opts||opts[0]?.disabled) return;
  opts.forEach(b=>b.disabled=true);
  opts[answer].classList.add('correct');
  if(idx!==answer) btn.classList.add('wrong');
  const qItem=btn.closest('.q-item');
  const fb=qItem?.querySelector('.q-feedback');
  if(fb){ fb.textContent=expl||''; fb.className='q-feedback show '+(idx===answer?'correct':'wrong'); }
  answered++; if(idx===answer) correct++;
  updateScoreBar(answered,items.length,correct,items.length);
  if(answered>=items.length) setTimeout(()=>showResult(correct,items.length),600);
}

function updateScoreBar(curr,tot,sc,total){
  const fill=document.getElementById('sb-fill');
  const num=document.getElementById('sb-num');
  const c=curr||answered; const t=tot||items.length; const s=sc||correct;
  if(fill) fill.style.width=`${t>0?(c/t)*100:0}%`;
  if(num) num.textContent=`${s} / ${t}`;
}

function showResult(sc,total){
  const pct=Math.round(sc/total*100);
  const card=document.getElementById('score-card'); card.style.display='block';
  document.getElementById('sc-score').textContent=`${sc}/${total}`;
  document.getElementById('sc-pct').textContent=`${pct}%`;
  document.getElementById('sc-msg').textContent=
    pct>=80?(lang==='ko'?'🎉 훌륭합니다!':'🎉 素晴らしい！'):
    pct>=60?(lang==='ko'?'👍 잘 하셨습니다!':'👍 よくできました！'):
    (lang==='ko'?'💪 계속 연습!':'💪 練習を続けましょう！');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

// ── 언어·초기화 ───────────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-ko][data-ja]').forEach(el=>{
    const t=l==='ko'?el.getAttribute('data-ko'):el.getAttribute('data-ja');
    if(t) el.innerHTML=t;
  });
  document.getElementById('btn-ko').classList.toggle('act',l==='ko');
  document.getElementById('btn-ja').classList.toggle('act',l==='ja');
}

(function(){
  setLang('ko');
  // URL 파라미터에서 급수 읽기
  const params=new URLSearchParams(location.search);
  grade=params.get('grade')||'4';
  const meta=GRADE_META[grade]||GRADE_META['4'];
  document.getElementById('hero-grade').textContent=meta.label;
  document.getElementById('hero-title').textContent=`漢検 ${meta.label} ${lang==='ko'?'연습':'練習'}`;
  document.getElementById('hero-chars').textContent=meta.chars;
  document.getElementById('nav-page').textContent=`🖊️ 漢検 ${meta.label}`;
})();
</script>
