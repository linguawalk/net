<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaWalk — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1C2B45;--navy2:#0e1f38;
  --teal:#2A7F6F;--teal-mid:#1D9E75;--teal-light:#e1f5ee;
  --bg:#F5F4F0;--white:#fff;
  --text:#1C2B45;--text-muted:#5a6a82;--text-light:#94a3b8;
  --border:rgba(28,43,69,0.12);--border-md:rgba(28,43,69,0.18);
  --red:#e24b4a;--red-light:#fcebeb;
  --shadow-md:0 8px 32px rgba(0,0,0,0.12);
}
body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(160deg,var(--navy2) 0%,#142244 50%,#1e3a6a 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;right:-100px;top:-100px;
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(42,127,111,0.15) 0%,transparent 70%);
  pointer-events:none;
}
body::after{
  content:'';position:absolute;left:-80px;bottom:-80px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(41,82,163,0.1) 0%,transparent 70%);
  pointer-events:none;
}

/* CARD */
.card{
  background:var(--white);
  border-radius:20px;
  width:100%;max-width:420px;
  padding:36px 36px 32px;
  box-shadow:var(--shadow-md);
  position:relative;z-index:1;
  animation:slideUp 0.4s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* LOGO */
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.logo-mark{width:36px;height:36px;background:var(--teal);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;}
.logo-text{font-size:18px;font-weight:700;color:var(--navy);}

/* TABS */
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:24px;gap:3px;}
.tab{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab.act{background:var(--white);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

/* FORM */
.form{display:flex;flex-direction:column;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);}
.form-input{
  padding:11px 14px;
  border:1px solid var(--border-md);
  border-radius:10px;
  font-size:14px;font-family:inherit;
  color:var(--text);background:var(--bg);
  outline:none;transition:all 0.2s;
}
.form-input:focus{border-color:var(--teal-mid);background:var(--white);box-shadow:0 0 0 3px rgba(29,158,117,0.1);}
.form-input.error{border-color:var(--red);background:var(--red-light);}

/* SUBMIT BTN */
.submit-btn{
  width:100%;padding:13px;border-radius:10px;
  font-size:15px;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;
  background:var(--teal-mid);color:#fff;
  transition:all 0.2s;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:hover{background:var(--teal);transform:translateY(-1px);}
.submit-btn:active{transform:translateY(0);}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* SPINNER */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR MESSAGE */
.error-msg{
  background:var(--red-light);
  border:0.5px solid rgba(226,75,74,0.25);
  border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--red);
  display:none;align-items:center;gap:8px;
}
.error-msg.show{display:flex;}

/* SUCCESS MESSAGE */
.success-msg{
  background:var(--teal-light);
  border:0.5px solid rgba(29,158,117,0.25);
  border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--teal);
  display:none;align-items:center;gap:8px;
}
.success-msg.show{display:flex;}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:10px;margin:4px 0;}
.divider-line{flex:1;height:0.5px;background:var(--border);}
.divider-text{font-size:12px;color:var(--text-light);}

/* SOCIAL BTN */
.social-btn{
  width:100%;padding:11px;border-radius:10px;
  font-size:13px;font-weight:600;
  border:1px solid var(--border-md);
  background:var(--white);color:var(--text);
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all 0.2s;
}
.social-btn:hover{background:var(--bg);border-color:var(--navy);}

/* FORGOT */
.forgot{font-size:12px;color:var(--teal-mid);cursor:pointer;text-align:right;text-decoration:none;font-weight:500;}
.forgot:hover{text-decoration:underline;}

/* FOOTER NOTE */
.footer-note{margin-top:20px;font-size:12px;color:rgba(255,255,255,0.5);text-align:center;position:relative;z-index:1;}
.footer-note a{color:rgba(255,255,255,0.7);text-decoration:none;}
.footer-note a:hover{color:#fff;}

/* TERMS */
.terms-text{font-size:11px;color:var(--text-light);line-height:1.6;text-align:center;margin-top:4px;}
.terms-text a{color:var(--teal-mid);text-decoration:none;}

/* PASSWORD STRENGTH */
.pw-strength{margin-top:4px;}
.pw-bars{display:flex;gap:3px;margin-bottom:3px;}
.pw-bar{flex:1;height:3px;border-radius:3px;background:var(--border);transition:background 0.3s;}
.pw-bar.weak{background:var(--red);}
.pw-bar.medium{background:#f97316;}
.pw-bar.strong{background:var(--teal-mid);}
.pw-label{font-size:11px;color:var(--text-light);}

/* LANG */
.lang-sw{position:absolute;top:20px;right:20px;display:flex;background:rgba(255,255,255,0.1);border-radius:20px;padding:2px;gap:1px;z-index:2;}
.lbtn{padding:4px 11px;border-radius:16px;font-size:11px;font-weight:600;border:none;background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.lbtn.act{background:var(--teal-mid);color:#fff;}
</style>
</head>
<body>

<div class="lang-sw">
  <button class="lbtn act" onclick="setLang('ko')" id="btn-ko">한국어</button>
  <button class="lbtn" onclick="setLang('en')" id="btn-en">EN</button>
</div>

<div class="card">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">LW</div>
    <span class="logo-text">LinguaWalk</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab act" id="tab-login" onclick="switchTab('login')" data-en="Sign In" data-ko="로그인">로그인</button>
    <button class="tab" id="tab-signup" onclick="switchTab('signup')" data-en="Sign Up" data-ko="회원가입">회원가입</button>
  </div>

  <!-- Error / Success -->
  <div class="error-msg" id="error-msg">
    <span>⚠️</span><span id="error-text"></span>
  </div>
  <div class="success-msg" id="success-msg">
    <span>✓</span><span id="success-text"></span>
  </div>

  <!-- ── LOGIN FORM ── -->
  <div id="form-login">
    <div class="form">
      <div class="form-group">
        <label class="form-label" data-en="Email" data-ko="이메일">이메일</label>
        <input type="email" class="form-input" id="login-email"
          placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label class="form-label" data-en="Password" data-ko="비밀번호">비밀번호</label>
          <a class="forgot" onclick="showForgot()" data-en="Forgot password?" data-ko="비밀번호 찾기">비밀번호 찾기</a>
        </div>
        <input type="password" class="form-input" id="login-pw"
          placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="submit-btn" id="login-btn" onclick="doLogin()">
        <span class="spinner" id="login-spin"></span>
        <span id="login-btn-text" data-en="Sign In" data-ko="로그인">로그인</span>
      </button>
    </div>

    <div class="divider" style="margin-top:16px;">
      <div class="divider-line"></div>
      <span class="divider-text" data-en="or" data-ko="또는">또는</span>
      <div class="divider-line"></div>
    </div>

    <button class="social-btn" style="margin-top:8px;" onclick="socialLogin('kakao')">
      <span style="font-size:16px;">💛</span>
      <span data-en="Continue with Kakao" data-ko="카카오로 계속하기">카카오로 계속하기</span>
    </button>
    <button class="social-btn" style="margin-top:8px;" onclick="socialLogin('google')">
      <span style="font-size:16px;">🔵</span>
      <span data-en="Continue with Google" data-ko="Google로 계속하기">Google로 계속하기</span>
    </button>
  </div>

  <!-- ── SIGNUP FORM ── -->
  <div id="form-signup" style="display:none;">
    <div class="form">
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group">
          <label class="form-label" data-en="Name" data-ko="이름">이름</label>
          <input type="text" class="form-input" id="signup-name"
            placeholder="홍길동" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" data-en="Nickname" data-ko="닉네임">닉네임</label>
          <input type="text" class="form-input" id="signup-nick" placeholder="linguawalker">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-en="Email" data-ko="이메일">이메일</label>
        <input type="email" class="form-input" id="signup-email"
          placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" data-en="Password" data-ko="비밀번호">비밀번호</label>
        <input type="password" class="form-input" id="signup-pw"
          placeholder="8자 이상" autocomplete="new-password"
          oninput="checkPwStrength(this.value)">
        <div class="pw-strength">
          <div class="pw-bars">
            <div class="pw-bar" id="pb1"></div>
            <div class="pw-bar" id="pb2"></div>
            <div class="pw-bar" id="pb3"></div>
            <div class="pw-bar" id="pb4"></div>
          </div>
          <span class="pw-label" id="pw-label"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-en="Confirm Password" data-ko="비밀번호 확인">비밀번호 확인</label>
        <input type="password" class="form-input" id="signup-pw2"
          placeholder="••••••••" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doSignup()">
      </div>
      <button class="submit-btn" id="signup-btn" onclick="doSignup()">
        <span class="spinner" id="signup-spin"></span>
        <span id="signup-btn-text" data-en="Create Account" data-ko="회원가입">회원가입</span>
      </button>
      <p class="terms-text">
        <span data-en="By signing up, you agree to our" data-ko="회원가입 시">회원가입 시</span>
        <a href="#" data-en="Terms of Service" data-ko="이용약관">이용약관</a>
        <span data-en="and" data-ko="및">및</span>
        <a href="#" data-en="Privacy Policy" data-ko="개인정보처리방침">개인정보처리방침</a>
        <span data-en="." data-ko="에 동의합니다.">에 동의합니다.</span>
      </p>
    </div>
  </div>
</div>

<p class="footer-note">
  <a href="index.html" data-en="← Back to LinguaWalk" data-ko="← LinguaWalk 홈으로">← LinguaWalk 홈으로</a>
</p>

<script>
/* ══════════════════════════════════════
   DEMO ACCOUNTS (임시 — Firebase 연동 전)
   나중에 이 부분만 Firebase Auth로 교체
══════════════════════════════════════ */
const DEMO_ACCOUNTS = [
  {
    email: 'admin@linguawalk.net',
    password: 'admin1234!',
    role: 'admin',
    name: '관리자',
    plan: 'admin'
  },
  {
    email: 'test@linguawalk.net',
    password: 'test1234!',
    role: 'user',
    name: '김민준',
    plan: 'TOEIC + IELTS'
  }
];

/* ── URL 해시로 탭 자동 선택 ── */
(function(){
  if(location.hash === '#signup') switchTab('signup');
})();

/* ── 이미 로그인된 경우 리다이렉트 ── */
(function(){
  const user = getUser();
  if(user){
    if(user.role === 'admin') location.href = 'admin.html';
    else location.href = 'mypage.html';
  }
})();

/* ── LANG ── */
let lang = localStorage.getItem('lw-lang') ||
  (navigator.language.startsWith('ko') ? 'ko' : 'en');

function setLang(l){
  lang = l;
  document.querySelectorAll('[data-en][data-ko]').forEach(el=>{
    el.innerHTML = l==='ko' ? el.dataset.ko : el.dataset.en;
  });
  document.getElementById('btn-ko').classList.toggle('act', l==='ko');
  document.getElementById('btn-en').classList.toggle('act', l==='en');
  localStorage.setItem('lw-lang', l);
}
setLang(lang);

/* ── TABS ── */
function switchTab(tab){
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
  document.getElementById('form-signup').style.display = isLogin ? 'none' : 'block';
  document.getElementById('tab-login').classList.toggle('act', isLogin);
  document.getElementById('tab-signup').classList.toggle('act', !isLogin);
  hideMessages();
}

/* ── MESSAGES ── */
function showError(msg){
  const el = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  el.classList.add('show');
  document.getElementById('success-msg').classList.remove('show');
}
function showSuccess(msg){
  const el = document.getElementById('success-msg');
  document.getElementById('success-text').textContent = msg;
  el.classList.add('show');
  document.getElementById('error-msg').classList.remove('show');
}
function hideMessages(){
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('success-msg').classList.remove('show');
}

/* ── AUTH HELPERS ── */
function getUser(){
  try{ return JSON.parse(localStorage.getItem('lw-user')); }catch(e){ return null; }
}
function saveUser(user){
  localStorage.setItem('lw-user', JSON.stringify(user));
}
function getUsers(){
  try{ return JSON.parse(localStorage.getItem('lw-users')) || [...DEMO_ACCOUNTS]; }
  catch(e){ return [...DEMO_ACCOUNTS]; }
}
function saveUsers(users){
  localStorage.setItem('lw-users', JSON.stringify(users));
}

/* ── LOGIN ── */
function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  hideMessages();

  if(!email){ showError(lang==='ko'?'이메일을 입력하세요.':'Please enter your email.'); return; }
  if(!pw)   { showError(lang==='ko'?'비밀번호를 입력하세요.':'Please enter your password.'); return; }

  setLoading('login', true);

  setTimeout(()=>{
    const users = getUsers();
    const found = users.find(u => u.email === email && u.password === pw);

    if(!found){
      showError(lang==='ko'
        ? '이메일 또는 비밀번호가 올바르지 않습니다.'
        : 'Incorrect email or password.');
      setLoading('login', false);
      return;
    }

    saveUser({ email: found.email, name: found.name, role: found.role, plan: found.plan });
    showSuccess(lang==='ko'
      ? `${found.name}님, 환영합니다! 이동 중...`
      : `Welcome, ${found.name}! Redirecting...`);

    setTimeout(()=>{
      if(found.role === 'admin') location.href = 'admin.html';
      else location.href = 'mypage.html';
    }, 900);
  }, 800);
}

/* ── SIGNUP ── */
function doSignup(){
  const name  = document.getElementById('signup-name').value.trim();
  const nick  = document.getElementById('signup-nick').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pw    = document.getElementById('signup-pw').value;
  const pw2   = document.getElementById('signup-pw2').value;
  hideMessages();

  if(!name) { showError(lang==='ko'?'이름을 입력하세요.':'Please enter your name.'); return; }
  if(!email){ showError(lang==='ko'?'이메일을 입력하세요.':'Please enter your email.'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showError(lang==='ko'?'올바른 이메일 형식이 아닙니다.':'Invalid email format.'); return;
  }
  if(pw.length < 8){ showError(lang==='ko'?'비밀번호는 8자 이상이어야 합니다.':'Password must be at least 8 characters.'); return; }
  if(pw !== pw2)   { showError(lang==='ko'?'비밀번호가 일치하지 않습니다.':'Passwords do not match.'); return; }

  setLoading('signup', true);

  setTimeout(()=>{
    const users = getUsers();
    if(users.find(u => u.email === email)){
      showError(lang==='ko'?'이미 사용 중인 이메일입니다.':'Email is already in use.');
      setLoading('signup', false);
      return;
    }

    const newUser = { email, password: pw, name, nick, role: 'user', plan: 'free', joinedAt: new Date().toISOString() };
    users.push(newUser);
    saveUsers(users);
    saveUser({ email, name, role: 'user', plan: 'free' });

    showSuccess(lang==='ko'
      ? `${name}님, 가입을 환영합니다! 이동 중...`
      : `Welcome, ${name}! Redirecting...`);

    setTimeout(()=>{ location.href = 'mypage.html'; }, 900);
  }, 800);
}

/* ── SOCIAL (준비 중) ── */
function socialLogin(provider){
  const msg = lang==='ko'
    ? `${provider==='kakao'?'카카오':'Google'} 로그인은 준비 중입니다.\n테스트 계정으로 로그인하세요.\n\n이메일: test@linguawalk.net\n비밀번호: test1234!`
    : `${provider} login is coming soon.\nPlease use the test account.\n\nEmail: test@linguawalk.net\nPassword: test1234!`;
  alert(msg);
}

/* ── FORGOT ── */
function showForgot(){
  const email = document.getElementById('login-email').value.trim();
  if(!email){
    showError(lang==='ko'?'이메일을 먼저 입력하세요.':'Please enter your email first.');
    return;
  }
  showSuccess(lang==='ko'
    ? `${email}로 비밀번호 재설정 링크를 보냈습니다. (준비 중)`
    : `Password reset link sent to ${email}. (Coming soon)`);
}

/* ── PASSWORD STRENGTH ── */
function checkPwStrength(pw){
  let score = 0;
  if(pw.length >= 8) score++;
  if(/[A-Z]/.test(pw) || /[a-z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;

  const bars = ['pb1','pb2','pb3','pb4'];
  const label = document.getElementById('pw-label');
  const cls = score<=1?'weak':score<=2?'medium':'strong';
  const labels = {
    ko:{weak:'약함',medium:'보통',strong:'강함',vstrong:'매우 강함'},
    en:{weak:'Weak',medium:'Fair',strong:'Strong',vstrong:'Very Strong'}
  };
  bars.forEach((id,i)=>{
    const bar = document.getElementById(id);
    bar.className = 'pw-bar' + (i < score ? ` ${cls}` : '');
  });
  label.textContent = pw.length === 0 ? '' : labels[lang][score>=4?'vstrong':cls];
  label.style.color = score<=1?'var(--red)':score<=2?'#f97316':'var(--teal-mid)';
}

/* ── LOADING STATE ── */
function setLoading(form, on){
  const btn  = document.getElementById(`${form}-btn`);
  const spin = document.getElementById(`${form}-spin`);
  const text = document.getElementById(`${form}-btn-text`);
  btn.disabled = on;
  spin.style.display = on ? 'block' : 'none';
  text.style.opacity = on ? '0' : '1';
}
</script>
</body>
</html>
